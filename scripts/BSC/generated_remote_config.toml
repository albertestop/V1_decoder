[data]
data_root_path = "/gpfs/projects/uab108/uab020077/data/processed_data/tba"
dataset_id = "2025-07-04_04_ESPM154_vol_000_subset_1024_target_random_order"
batch_size = 8
val_split = 0.1
val_trial_selection = "run_179"
shuffle_train = true
num_workers = 16
pin_memory = true
drop_last = false

[custom_model]
target = "v1tovideo.neural_autoencoder.models:TAE_v1_01_1"
input_dim = 64
latent_dim = 64
latent_num_tokens = 512
num_layers = 4
nhead = 4
t_input_dropout = 0.0
trans_dropout = 0.1
head_dropout = 0.0

[train]
epochs = 350
learning_rate = 0.0001
weight_decay = 0.0001
grad_clip_norm = 1.0
device = "cuda:0"

[train.loss]
name = "combined"
weight_id = 0.0001
weight_time = 10.0
weight_rec = 10.0
name_id = "cross_entropy"
name_time = "masked_mae"
name_rec = "masked_mse"
poisson_log_input = true
poisson_full = false
poisson_eps = 1e-08

[output]
dir = "/gpfs/projects/uab108/uab020077/transformer_arch/transformer_arch_7/transformer_arch/outputs/neural_autoencoder/default_run"
