[data]
data_root_path = "/home/albertestop/data/processed_data/tba"
dataset_id = "2025-07-04_04_ESPM154_vol_000_subset_1024_target_random_order"

batch_size = 8
val_split = 0.1
# Options: "random", "run_183", "run_179", "run_179_183_random"
val_trial_selection = "run_183"
shuffle_train = true
num_workers = 16
pin_memory = true
drop_last = false

[custom_model]
target = "v1tovideo.neural_autoencoder.models:TAE_v1_01_1"
input_dim = 64
latent_dim = 64
latent_num_tokens = 128
num_layers = 4
nhead = 4
t_input_dropout = 0.0
trans_dropout = 0.10
head_dropout = 0.0

[train]
epochs = 350
learning_rate = 1e-4
#lr_start = 2e-4 #Comment this whole line to use no lr schedule
weight_decay = 1e-4
grad_clip_norm = 1.0
#default device = "cuda:1"
device = "cuda:0"

[train.loss]
# Supported: "masked_mse", "masked_mae", "poisson_nll", "combined"
name = "combined"
# Combined options (used only when name = "combined")
weight_id = 0.1
weight_time = 10.0
weight_rec = 10.0
# id supports: "cross_entropy"
name_id = "cross_entropy"
# time/rec support: "masked_mse", "masked_mae", "poisson_nll"
name_time = "masked_mae"
name_rec = "masked_mse"
# PoissonNLLLoss options (used only when name = "poisson_nll")
poisson_log_input = true
poisson_full = false
poisson_eps = 1e-8

[output]
dir = "outputs/neural_autoencoder/default_run"
